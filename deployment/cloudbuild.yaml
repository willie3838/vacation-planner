# Copyright 2026 Google LLC
# 100% Automated Google Cloud Build Pipeline for Vacation Planner Agent

steps:
  # 1. Lint and Format Checks
  - name: "python:3.11-slim"
    id: "lint-and-format"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        pip install uv
        uv pip install --system -e ".[lint,dev]"
        ruff check .
        ruff format --check .

  # 2. Deterministic Unit Tests (18 Skill Tests + Memory + Telemetry)
  - name: "python:3.11-slim"
    id: "unit-tests"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        pip install uv
        uv pip install --system -e ".[dev]"
        pytest tests/unit/ -v

  # 3. Build & Push Container Image
  - name: "gcr.io/cloud-builders/docker"
    id: "docker-build-push"
    args:
      - "buildx"
      - "build"
      - "--push"
      - "-t"
      - "$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/vacation-planner:$SHORT_SHA"
      - "-f"
      - "deployment/Dockerfile"
      - "."

  # 4. Trigger Cloud Deploy Release
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "cloud-deploy-release"
    entrypoint: "gcloud"
    args:
      - "deploy"
      - "releases"
      - "create"
      - "release-$SHORT_SHA"
      - "--project=$PROJECT_ID"
      - "--region=$_LOCATION"
      - "--delivery-pipeline=vacation-planner-pipeline"
      - "--images=vacation-planner-image=$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/vacation-planner:$SHORT_SHA"

substitutions:
  _LOCATION: "us-central1"
  _REPO_NAME: "vacation-planner-repo"

options:
  logging: CLOUD_LOGGING_ONLY
